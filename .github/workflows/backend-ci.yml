name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

jobs:
  test:
    name: Test (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Bridge Docker socket to tcp://localhost:2375
        # The pom pins DOCKER_HOST=tcp://localhost:2375 (needed for Docker Desktop on the
        # dev's Windows box). On the Linux runner Docker listens on the unix socket, so we
        # forward 2375 -> /var/run/docker.sock and the existing config works unchanged.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq socat
          socat TCP-LISTEN:2375,reuseaddr,fork UNIX-CONNECT:/var/run/docker.sock &
          for i in $(seq 1 10); do curl -s http://localhost:2375/_ping && break; sleep 1; done
          echo

      - name: Run tests
        working-directory: backend
        # Use system Maven, not ./mvnw — the wrapper script has CRLF line endings and fails on Linux.
        run: mvn -B -ntp test
